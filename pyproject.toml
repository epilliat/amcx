[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amcx"
dynamic = ["version"]          # lue depuis auto_grading/_version.py
description = "AMCx — AMC eXtended : éditeur de sujet QCM + correction automatique (CV + classifieur, UI Flask de relecture, sans dépendance au binaire AMC)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Pilliat", email = "epilliat@gmail.com" }]
keywords = ["qcm", "omr", "auto-multiple-choice", "grading", "opencv"]

# Dépendances : uniquement des wheels pures → zéro dépendance système (pas de poppler).
dependencies = [
    "opencv-python-headless>=4.8",
    "PyMuPDF>=1.24",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "flask>=3.0",
    "numpy>=1.26",
    # Épinglé sur la version mineure qui a produit models/*.pkl : un pickle
    # sklearn n'est pas garanti compatible entre versions mineures, et c'est le
    # cœur de la décision « case cochée ». Pour changer : ré-entraîner
    # (build_dataset.py + train_classifier.py) puis bouger cette borne.
    "scikit-learn>=1.8,<1.9",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "joblib>=1.3",
]

# La commande `amcx` : démarre le serveur, ou `amcx doctor` / `amcx update`.
[project.scripts]
amcx = "auto_grading.cli:main"

[tool.hatch.version]
path = "auto_grading/_version.py"

[project.optional-dependencies]
# Voie Claude-vision héritée (grader.py) — non requise par le pipeline CV/ML.
api = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/epilliat/amcx"

[tool.hatch.build.targets.wheel]
packages = ["auto_grading"]
# `auto_grading/tex/automultiplechoice.sty` (style AMC vendorisé) et
# `auto_grading/models/*.pkl` doivent être embarqués : ce sont des données de
# l'installation, pas du code Python. Cf. auto_grading/tex/README.md.
artifacts = ["auto_grading/tex/*.sty", "auto_grading/models/*.pkl"]

# Installation utilisateur (zéro paquet système) :
#   uv pip install -e .            # cœur du pipeline
#   uv pip install -e ".[api]"     # + voie Claude-vision optionnelle
