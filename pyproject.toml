[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amcx"
version = "0.1.0"
description = "AMCx — AMC eXtended : éditeur de sujet QCM + correction automatique (CV + classifieur, UI Flask de relecture, sans dépendance au binaire AMC)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Pilliat", email = "epilliat@gmail.com" }]
keywords = ["qcm", "omr", "auto-multiple-choice", "grading", "opencv"]

# Dépendances : uniquement des wheels pures → zéro dépendance système (pas de poppler).
dependencies = [
    "opencv-python-headless>=4.8",
    "PyMuPDF>=1.24",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "flask>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Voie Claude-vision héritée (grader.py) — non requise par le pipeline CV/ML.
api = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/epilliat/amcx"

[tool.hatch.build.targets.wheel]
packages = ["auto_grading"]

# Installation utilisateur (zéro paquet système) :
#   uv pip install -e .            # cœur du pipeline
#   uv pip install -e ".[api]"     # + voie Claude-vision optionnelle
